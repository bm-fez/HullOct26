name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x

    - name: Build
      run: dotnet build ./SampleSolution/sample/sample.csproj

    - name: Test
      run: dotnet test --verbosity normal --logger trx --results-directory ./TestResults ./SampleSolution/sample.unittests/sampleunittests.csproj
      
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action/linux@v2 
      if: always()
      with:
        files: "**/*.trx"
        comment_title: "Unit Test Results"

